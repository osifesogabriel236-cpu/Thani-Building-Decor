<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thani AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      max-height: 850px;
      background: white;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.12);
    }

    .header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 22px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 13px;
      opacity: 0.8;
    }

    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #fafafa;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      margin-bottom: 14px;
      border-radius: 15px;
      line-height: 1.5;
      font-size: 14px;
    }

    .bot {
      background: #e9e9e9;
      color: #111;
      border-bottom-left-radius: 4px;
    }

    .user {
      background: #111;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #ddd;
      background: white;
    }

    .input-area input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 25px;
      outline: none;
      font-size: 14px;
    }

    .input-area button {
      width: 50px;
      border: none;
      border-radius: 50%;
      background: #111;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .typing {
      font-size: 12px;
      color: #777;
      margin-bottom: 10px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="header">
      <h1>Thani AI Assistant 🤖</h1>
      <p>Ask us anything about your building & decoration project</p>
    </div>

    <div class="chat-box" id="chatBox">

      <div class="message bot">
        👋 Hello! I'm the Thani Building Decor AI Assistant.<br><br>
        Tell me what you're planning to decorate, and I'll help you figure out the best service for your project.
      </div>

    </div>

    <div class="typing" id="typing">
      Thani AI is thinking...
    </div>

    <div class="input-area">
      <input
        type="text"
        id="userInput"
        placeholder="e.g. I want to decorate my sitting room..."
        onkeypress="handleKey(event)"
      >

      <button onclick="sendMessage()">➤</button>
    </div>

  </div>

  <script>

    function handleKey(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }

    function addMessage(text, sender) {

      const chatBox = document.getElementById("chatBox");

      const message = document.createElement("div");

      message.className = "message " + sender;

      message.innerHTML = text;

      chatBox.appendChild(message);

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendMessage() {

      const input = document.getElementById("userInput");

      const message = input.value.trim();

      if (!message) return;

      addMessage(message, "user");

      input.value = "";

      document.getElementById("typing").style.display = "block";

      setTimeout(() => {

        document.getElementById("typing").style.display = "none";

        addMessage(
          "I understand 👍. I'm being connected to the Thani AI system now. Soon I'll be able to understand your project, recommend suitable services, answer questions and help prepare your enquiry.",
          "bot"
        );

      }, 800);
    }

  </script>

</body>
  </html>
